<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Clinic Patient History</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --purple: #818cf8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }
        .container { display: flex; height: 100vh; }
        
        /* Sidebar */
        .sidebar {
            width: 300px;
            background: #111827;
            padding: 2rem;
            border-right: 1px solid #374151;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 10px; }
        label { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 0.5rem; }
        select {
            width: 100%; padding: 12px; background: var(--bg-card);
            border: 1px solid #374151; color: white; border-radius: 8px;
            font-size: 1rem; outline: none;
        }
        .stats-card {
            background: linear-gradient(145deg, var(--bg-card), #252f42);
            padding: 1.5rem; border-radius: 12px; border: 1px solid #374151;
        }
        .stat-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; }
        .stat-item strong { color: var(--accent); }

        /* Main */
        .content { flex: 1; padding: 3rem; overflow-y: auto; background: radial-gradient(circle at top right, #1e293b 0%, var(--bg-dark) 40%); }
        header h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        header p { color: var(--text-muted); margin-bottom: 2rem; }

        .timeline-item {
            background: var(--bg-card); border-radius: 12px; padding: 1.5rem;
            margin-bottom: 1.5rem; border-left: 4px solid var(--accent);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3); animation: slideIn 0.3s ease-out;
        }
        .visit-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid #374151; padding-bottom: 0.5rem; }
        .clinic-badge { background: rgba(56, 189, 248, 0.1); color: var(--accent); padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .visit-details { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .detail-box { margin-top: 1rem; }
        .detail-title { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
        
        .rx-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 5px; }
        .tag { padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; background: #334155; }
        .tag.rx { border: 1px solid var(--purple); color: var(--purple); }
        .tag.diag { border: 1px solid var(--success); color: var(--success); }

        .empty-state, .loading { text-align: center; margin-top: 5rem; color: var(--text-muted); }
        .hidden { display: none !important; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <aside class="sidebar">
        <div class="logo"><i class="fa-solid fa-heart-pulse"></i> MedConnect</div>
        <div class="search-box">
            <label>Select Patient</label>
            <select id="patientSelect">
                <option value="">-- Choose Patient --</option>
                <option value="1">Rajesh Kumar</option>
                <option value="2">Sunita Sharma</option>
                <option value="3">Amit Patel</option>
                <option value="4">Priya Desai</option>
                <option value="5">Vikram Singh</option>
            </select>
        </div>
        <div class="stats-card hidden" id="statsCard">
            <h3>Patient Stats</h3>
            <div class="stat-item"><span>Blood Group</span><strong id="dispBlood">-</strong></div>
            <div class="stat-item"><span>Clinics Visited</span><strong id="dispClinics">-</strong></div>
            <div class="stat-item"><span>Total Visits</span><strong id="dispVisits">-</strong></div>
        </div>
    </aside>

    <main class="content">
        <header>
            <h1>Patient Medical History</h1>
            <p>Tracking continuity of care across multiple facilities</p>
        </header>
        <div id="loading" class="loading hidden"><div class="spinner"></div> Loading Records...</div>
        <div id="historyContainer" class="timeline hidden"></div>
        <div id="emptyState" class="empty-state">
            <i class="fa-solid fa-file-medical-alt" style="font-size: 3rem; margin-bottom: 1rem;"></i>
            <h3>Select a patient to view their complete medical history</h3>
        </div>
    </main>
</div>

<script>
    // THIS IS THE MOCK DATA (Simulating your Database)
    const mockDatabase = {
        1: { // Rajesh Kumar
            blood: "O+", visits: 2, clinics: 2,
            records: [
                { date: "2024-03-20", clinic: "Metro Medical Center", city: "Delhi", doctor: "Dr. Suman Rao", specialty: "Cardiology", complaint: "Chest pain", diagnosis: "Angina pectoris", meds: "Amlodipine 5mg (Once daily)" },
                { date: "2024-01-15", clinic: "City Health Clinic", city: "Mumbai", doctor: "Dr. Anil Mehta", specialty: "General Medicine", complaint: "Fever and cough", diagnosis: "Upper respiratory infection", meds: "Paracetamol 500mg, Amoxicillin" }
            ]
        },
        2: { // Sunita Sharma
            blood: "A+", visits: 1, clinics: 1,
            records: [
                { date: "2024-02-10", clinic: "Metro Medical Center", city: "Delhi", doctor: "Dr. Suresh Iyer", specialty: "Dermatology", complaint: "Skin rash", diagnosis: "Urticaria (hives)", meds: "Cetirizine 10mg" }
            ]
        },
        3: { // Amit Patel
            blood: "B+", visits: 2, clinics: 2,
            records: [
                { date: "2024-04-05", clinic: "City Health Clinic", city: "Mumbai", doctor: "Dr. Anil Mehta", specialty: "General Medicine", complaint: "Diabetes follow-up", diagnosis: "Type 2 Diabetes Mellitus", meds: "Metformin 500mg" },
                { date: "2024-01-25", clinic: "Sunrise Healthcare", city: "Ahmedabad", doctor: "Dr. Rajiv Shah", specialty: "Orthopedics", complaint: "Knee pain", diagnosis: "Osteoarthritis of knee", meds: "Ibuprofen 400mg" }
            ]
        }
    };

    const patientSelect = document.getElementById('patientSelect');
    const historyContainer = document.getElementById('historyContainer');
    const emptyState = document.getElementById('emptyState');
    const loading = document.getElementById('loading');
    const statsCard = document.getElementById('statsCard');

    patientSelect.addEventListener('change', (e) => {
        const id = e.target.value;
        if (!id) {
            statsCard.classList.add('hidden');
            historyContainer.classList.add('hidden');
            emptyState.classList.remove('hidden');
            return;
        }

        emptyState.classList.add('hidden');
        loading.classList.remove('hidden');
        historyContainer.classList.add('hidden');

        // Simulate network delay
        setTimeout(() => {
            const data = mockDatabase[id];
            renderData(data);
        }, 800);
    });

    function renderData(data) {
        // Update Stats
        document.getElementById('dispBlood').innerText = data.blood;
        document.getElementById('dispClinics').innerText = data.clinics;
        document.getElementById('dispVisits').innerText = data.visits;
        statsCard.classList.remove('hidden');

        // Render Timeline
        historyContainer.innerHTML = '';
        data.records.forEach(rec => {
            const html = `
                <div class="timeline-item">
                    <div class="visit-header">
                        <span style="font-weight:bold; color:var(--accent)">${rec.date}</span>
                        <span class="clinic-badge"><i class="fa-solid fa-hospital"></i> ${rec.clinic}</span>
                    </div>
                    <div style="margin-bottom:10px; color:#ccc;">${rec.city} &bull; ${rec.doctor} (${rec.specialty})</div>
                    
                    <div class="visit-details">
                        <div class="detail-box">
                            <div class="detail-title">CHIEF COMPLAINT</div>
                            <div>${rec.complaint}</div>
                        </div>
                        <div class="detail-box">
                            <div class="detail-title">DIAGNOSIS</div>
                            <span class="tag diag">${rec.diagnosis}</span>
                        </div>
                        <div class="detail-box" style="grid-column: span 2;">
                            <div class="detail-title">PRESCRIPTION</div>
                            <div class="rx-grid">
                                <span class="tag rx"><i class="fa-solid fa-pills"></i> ${rec.meds}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            historyContainer.insertAdjacentHTML('beforeend', html);
        });
        

        loading.classList.add('hidden');
        historyContainer.classList.remove('hidden');
    }
</script>
</body>
</html>
